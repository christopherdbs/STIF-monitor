<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>STIF - Dashboard Maintenance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .status-indicator {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            display: inline-block;
        }
        .bg-green { background-color: #28a745; }
        .bg-orange { background-color: #fd7e14; }
        .bg-red { background-color: #dc3545; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">STIF Equipment Monitor</span>
        <a th:href="@{/incidents/new}" class="btn btn-primary">Report an incident</a>
    </div>
</nav>

<div class="container">
    <div class="card shadow">
        <div class="card-header bg-white">
            <h2 class="h5 mb-0">Active Incidents</h2>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>Status</th>
                    <th>Equipment</th>
                    <th>Station</th>
                    <th>Reported since</th>
                    <th>Type</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="incident : ${incidents}">
                    <td>
                        <div th:classappend="${incident.statusIndicator == 'GREEN' ? 'bg-green' :
                                               (incident.statusIndicator == 'ORANGE' ? 'bg-orange' : 'bg-red')}"
                             class="status-indicator"
                             th:title="${incident.elapsedHours} + ' heures écoulées'">
                        </div>
                    </td>
                    <td th:text="${incident.report.equipment.serialNumber}" class="fw-bold"></td>
                    <td th:text="${incident.report.equipment.station.stationName}"></td>
                    <td th:text="${incident.elapsedHours} + ' h'"></td>
                    <td th:text="${incident.report.nature}"></td>
                    <td>
                        <a th:href="@{'/incidents/detail/' + ${incident.report.id}}"  class="btn btn-sm btn-outline-info">Détails</a>
                        <a th:href="@{/incidents/edit/{id}(id=${incident.report.id})}" class="btn btn-sm btn-outline-secondary">Modifier</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(incidents)}">
                    <td colspan="6" class="text-center text-muted">Aucun incident critique à signaler. Tout fonctionne !</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>


</body>
</html>
