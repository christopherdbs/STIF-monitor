<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>STIF - Not Found Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #0d6efd;
            line-height: 1;
        }
    </style>
</head>
<body>
<div class="error-container text-center">
    <div class="error-code">404</div>
    <h1 class="mb-3">Page Not Found</h1>

    <p class="lead mb-5">
        <span th:text="${errorMessage != null ? errorMessage : 'The page you are looking for is unavailable or has been moved.'}">
            The requested page could not be found.
        </span>
    </p>
    </p>
    <a th:href="@{/}" class="btn btn-primary btn-lg px-5 shadow-sm">
        Back to Dashboard
    </a>
</div>
</body>
</html>
