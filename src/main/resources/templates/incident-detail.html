<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Incident Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
        }

        .card {
            border-radius: 18px;
            border: none;
        }

        .header {
            background: linear-gradient(135deg, #0d6efd, #3b82f6);
            color: white;
            padding: 25px;
            border-radius: 18px 18px 0 0;
        }

        .info-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 12px 15px;
            border: 1px solid #e9ecef;
        }

        .label {
            font-size: 0.85rem;
            color: #6c757d;
            font-weight: 600;
        }

        .value {
            font-size: 1rem;
            font-weight: 500;
        }

        .badge-status {
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container py-5" style="max-width: 750px;">
    <div class="card shadow">

        <!-- Header -->
        <div class="header text-center">
            <h3 class="mb-1">Incident Detail</h3>
            <small>Detailed information</small>
        </div>

        <!-- Body -->
        <div class="p-4">

            <div class="row g-3">

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="label">ID</div>
                        <div class="value" th:text="${incidentReport.id}"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="label">Nature</div>
                        <div class="value" th:text="${incidentReport.nature}"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="label">Date Time</div>
                        <div class="value" th:text="${incidentReport.dateTime}"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="label">Assigned Company</div>
                        <div class="value" th:text="${incidentReport.assignedCompany}"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="label">Agent ID</div>
                        <div class="value" th:text="${incidentReport.agentId}"></div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="info-box">
                        <div class="label">Repaired</div>
                        <div class="value">
                            <span class="badge bg-success badge-status"
                                  th:if="${incidentReport.isRepaired}">Yes</span>

                            <span class="badge bg-danger badge-status"
                                  th:unless="${incidentReport.isRepaired}">No</span>
                        </div>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="info-box">
                        <div class="label">Equipment</div>
                        <div class="value"
                             th:text="${incidentReport.equipment != null ? incidentReport.equipment.type : 'No equipment'}">
                        </div>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="info-box">
                        <div class="label">Status</div>
                        <div class="value"
                             th:text="${incidentReport.equipment != null ? incidentReport.equipment.status : 'No equipment'}">
                        </div>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="info-box">
                        <div class="label">Comments</div>
                        <div class="value" th:text="${incidentReport.comments}"></div>
                    </div>
                </div>

            </div>

            <!-- Button -->
            <div class="mt-4 text-center">
                <a th:href="@{/}" class="btn btn-outline-secondary px-4">
                    ← Back
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
