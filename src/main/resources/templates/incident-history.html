<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Equipment History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f1f5f9, #f8fafc);
            min-height: 100vh;
        }
        .header-section {
            background: white;
            border-bottom: 1px solid #e2e8f0;
            padding: 40px 0;
            margin-bottom: 30px;
        }
        .timeline-item {
            position: relative;
            padding-left: 30px;
            margin-bottom: 20px;
            border-left: 2px solid #cbd5e1;
        }
        .timeline-item::before {
            content: "";
            position: absolute;
            left: -9px;
            top: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3b82f6;
            border: 3px solid white;
        }
        .history-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: transform 0.2s;
        }
        .history-card:hover {
            transform: translateX(5px);
            border-color: #3b82f6;
        }
        .date-badge {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="header-section shadow-sm">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2">
                        <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Dashboard</a></li>
                        <li class="breadcrumb-item active">Equipment History</li>
                    </ol>
                </nav>
                <h2 class="fw-bold mb-0" th:text="'History: ' + ${equipment.type} + ' (' + ${equipment.serialNumber} + ')'"></h2>
                <p class="text-muted mb-0" th:text="${equipment.station.stationName}"></p>
            </div>
            <a th:href="@{/}" class="btn btn-outline-primary">Back to Dashboard</a>
        </div>
    </div>
</div>

<div class="container pb-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">

            <div th:if="${#lists.isEmpty(fullHistory)}" class="text-center py-5">
                <p class="text-muted">No incident history found for this equipment.</p>
            </div>

            <div th:each="report : ${fullHistory}" class="timeline-item">
                <div class="history-card p-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <span class="date-badge" th:text="${#temporals.format(report.dateTime, 'dd MMMM yyyy - HH:mm')}"></span>
                            <h5 class="mb-1 mt-1 fw-bold text-dark" th:text="${report.nature}">Nature</h5>
                        </div>
                        <span th:class="${report.status ? 'badge bg-success-subtle text-success' : 'badge bg-warning-subtle text-warning'}"
                              th:text="${report.status ? 'Resolved' : 'Pending'}">
                        </span>
                    </div>

                    <div class="bg-light p-3 rounded-3 mb-3 border">
                        <small class="text-uppercase fw-bold text-muted d-block mb-1" style="font-size: 0.7rem;">Comments</small>
                        <p class="mb-0 text-secondary" th:text="${report.comments}"></p>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <div class="small text-muted">
                            <span class="me-3"><strong>Agent ID:</strong> <span th:text="${report.agentId}"></span></span>
                            <span><strong>Company:</strong> <span th:text="${report.assignedCompany}"></span></span>
                        </div>
                        <a th:href="@{/incidents/{id}(id=${report.id})}" class="btn btn-sm btn-link p-0 text-decoration-none">View report →</a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
